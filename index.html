<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">

    <h2>💰 Budget App</h2>

    <button onclick="naytaSivu('etusivu')">🏠 Etusivu</button>

    <button onclick="naytaSivu('tapahtumatSivu')">📝 Tapahtumat</button>

    <button onclick="naytaSivu('tavoitteet')">🎯 Tavoitteet</button>

    <button onclick="naytaSivu('tilastot')">📊 Tilastot</button>

    <button onclick="naytaSivu('budjetit')">💳 Budjetit</button>

    <button onclick="naytaSivu('sijoitukset')">📈 Sijoitukset</button>

    <button onclick="naytaSivu('asetukset')">⚙️ Asetukset</button>

    <div class="content">

    <section id="etusivu">

        <!-- Nykyinen saldo, kortit jne -->

    </section>

    <section id="tapahtumatSivu" style="display:none;">

        <!-- Tapahtumalista -->

    </section>

    <section id="tavoitteet" style="display:none;">

        <h2>🎯 Kuukausitavoitteet</h2>

    </section>

    <section id="tilastot" style="display:none;">

        <h2>📊 Tilastot</h2>

    </section>

    <section id="budjetit" style="display:none;">

        <h2>💳 Budjetit</h2>

    </section>

    <section id="sijoitukset" style="display:none;">

        <h2>📈 Sijoitukset</h2>

    </section>

    <section id="asetukset" style="display:none;">

        <h2>⚙️ Asetukset</h2>

    </section>
    </div>
</div>

    <div class="container">

<h1>💰 Budget App</h1>
<p class="subtitle">Hallitse talouttasi helposti ja tyylikkäästi.</p>

<div class="saldo-kortti">
    <div class="saldo-otsikko">Nykyinen saldo</div>
    <div class="saldo-arvo">
        <span id="saldo">0 €</span>

<div class="yhteenveto">
    <p>💰 Tulot: <span id="tulot">0 €</span></p>
    <p>💸 Menot: <span id="menot">0 €</span></p>
</div>

</div class="stats-row">
<div class="form-card">

    <div class="form-row">

    <div class="form-group">

        <label>Kategoria</label>

        <select id="kategoria">

            <option value="Palkka">💰 Palkka</option>
            <option value="Ruoka">🛒 Ruoka</option>
            <option value="Asuminen">🏠 Asuminen</option>
            <option value="Auto">🚗 Auto</option>
            <option value="Liikenne">🚌 Liikenne</option>
            <option value="Vapaa-aika">🎮 Vapaa-aika</option>
            <option value="Ravintola">🍔 Ravintola</option>
            <option value="Terveys">🏥 Terveys</option>
            <option value="Ostokset">🛍️ Ostokset</option>
            <option value="Sijoitukset">📈 Sijoitukset</option>
            <option value="Muu">📦 Muu</option>

        </select>

    </div>

    <div class="form-group">

        <label>Päivämäärä</label>

        <input
            type="date"
            id="paivamaara">

    </div>

    <div class="form-group">

        <label>Tyyppi</label>

        <select id="tyyppi">

            <option value="tulo">🟢 Tulo</option>
            <option value="meno">🔴 Meno</option>

        </select>

    </div>

</div>

    </div>

    <div class="form-row">

        <div class="form-group">
            <label>Kategoria</label>

            <select id="kategoria">
                <option>Ruoka</option>
                <option>Palkka</option>
                <option>Asuminen</option>
                <option>Auto</option>
                <option>Vapaa-aika</option>
                <option>Sijoitukset</option>
                <option>Muu</option>
            </select>

        </div>

        <div class="form-group">
            <label>Tyyppi</label>

            <select id="tyyppi">
                <option value="tulo">Tulo</option>
                <option value="meno">Meno</option>
            </select>

        </div>

    </div>

    <button onclick="lisaaTapahtuma()">
        Lisää tapahtuma
    </button>

</div>

<div 

    <div class="mini-card">
        <span class="label">Säästö</span>
        <span id="saasto">0 €</span>
    </div>

    <div class="mini-card">
        <span class="label">Tapahtumia</span>
        <span id="maara">0</span>
    </div>

</div>

<h3>Tapahtumat</h3>
<ul id="tapahtumat"></ul>

<script src="script.js"></script>

</div>
