<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

<h1>💰 Budget App</h1>
<p class="subtitle">Hallitse talouttasi helposti ja tyylikkäästi.</p>

<div class="saldo-kortti">
    <div class="saldo-otsikko">Nykyinen saldo</div>
    <div class="saldo-arvo">
        <span id="saldo">0 €</span>
    </div>
</div>

<div class="yhteenveto">
    <p>💰 Tulot: <span id="tulot">0 €</span></p>
    <p>💸 Menot: <span id="menot">0 €</span></p>
</div>
<button onclick="lisaaTulo()">Lisää tulo</button>
<button onclick="lisaaMeno()">Lisää meno</button>

<h3>Tapahtumat</h3>
<ul id="tapahtumat"></ul>

<script src="script.js"></script>

</div>
</body>
</html>
